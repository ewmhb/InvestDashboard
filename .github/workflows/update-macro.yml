name: Update macro observations
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5,11,17,23 * * *'
  push:
    branches: [main]
    paths: [update_macro.py, update_liquidity.py, update_calendar.py, .github/workflows/update-macro.yml]
permissions:
  contents: write
concurrency:
  group: update-macro
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_macro.py
        id: macro
        continue-on-error: true
      - run: python update_liquidity.py
        id: liquidity
        continue-on-error: true
      - run: python update_calendar.py
        id: calendar
        continue-on-error: true
      - name: Save observations and source health even on partial failure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro_data.json liquidity.json economic_calendar.json
          git diff --cached --quiet && exit 0
          git commit -m "Update macro and shared liquidity observations"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report upstream failures
        if: steps.macro.outcome == 'failure' || steps.liquidity.outcome == 'failure' || steps.calendar.outcome == 'failure'
        run: |
          echo '::error::At least one source failed. Available observations and failure metadata were saved.'
          exit 1
