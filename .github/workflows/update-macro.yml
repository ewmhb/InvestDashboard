name: Update macro observations
on:
  workflow_dispatch:
  schedule:
    - cron: '43 23 * * 1-5'
  push:
    branches: [main]
    paths: [update_macro.py, .github/workflows/update-macro.yml]
permissions:
  contents: write
concurrency:
  group: update-macro
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_macro.py
      - name: Save shared observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro_data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update macro observations"
          git pull --rebase origin main
          git push origin HEAD:main
