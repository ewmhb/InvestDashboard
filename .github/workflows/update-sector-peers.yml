name: Update shared sector comparisons
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: Additional tickers to collect (comma separated)
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - update-sector-peers.cjs
      - .github/workflows/update-sector-peers.yml
permissions:
  contents: write
concurrency:
  group: shared-sector-comparisons
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect server data
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EXTRA_TICKERS: ${{ inputs.tickers }}
        run: node update-sector-peers.cjs
      - name: Publish public data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sector-peers-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update shared sector comparisons"
          git pull --rebase origin main
          git push origin HEAD:main
