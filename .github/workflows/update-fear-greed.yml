name: Update Fear and Greed data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-fear-greed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download CNN Fear and Greed data
        run: python update_fear_greed.py
      - name: Commit updated Fear and Greed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fear_greed.json
          git diff --cached --quiet || git commit -m "Update Fear and Greed data"
          git push
